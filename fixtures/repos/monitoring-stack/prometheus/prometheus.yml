global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-1:9100", "node-2:9100", "node-3:9100"]

  - job_name: portfolio
    metrics_path: /api/metrics
    static_configs:
      - targets: ["portfolio:3000"]
