# Lab network. Positions are in pixels on the canvas.
nodes:
  # Switches, top to bottom
  - id: crs504
    label: CRS504
    kind: switch
    tech: MikroTik
    color: "#3b82f6"
    x: 0
    y: 0
    detail: Core switch. 10G and 25G links to the servers, 2x10G uplink to the CRS309.
  - id: crs309
    label: CRS309
    kind: switch
    tech: MikroTik
    x: 0
    y: 260
    detail: Aggregation switch between the core and the 1G access layer.
  - id: hp1920
    label: HP 1920
    kind: switch
    tech: HPE
    x: 0
    y: 520
    detail: 1G access switch. Single 1G link to each server.

  # Servers
  - id: local1
    label: local1
    kind: server
    tech: Proxmox
    color: "#e45c00"
    x: 450
    y: 40
    detail: Proxmox node. 2x10G to the CRS504 and 1G to the HP 1920.
  - id: local2
    label: local2
    kind: server
    tech: Proxmox
    color: "#e45c00"
    x: 450
    y: 180
    detail: Proxmox node. 2x10G to the CRS504 and 1G to the HP 1920.
  - id: local3
    label: local3
    kind: server
    tech: Proxmox
    color: "#e45c00"
    x: 450
    y: 320
    detail: Proxmox node. 2x25G to the CRS504 and 1G to the HP 1920.
  - id: local4
    label: local4
    kind: server
    tech: Proxmox
    color: "#e45c00"
    x: 450
    y: 460
    detail: Proxmox node. 2x10G to the CRS504 and 1G to the HP 1920.

edges:
  # Switch to switch
  - { from: crs504, to: crs309, label: 2x10G, fromSide: bottom, toSide: top, double: true }
  - { from: crs309, to: hp1920, label: 2x1G, fromSide: bottom, toSide: top, double: true }

  # Servers to CRS504
  - { from: crs504, to: local1, label: 2x10G, double: true }
  - { from: crs504, to: local2, label: 2x10G, double: true }
  - { from: crs504, to: local3, label: 2x25G, double: true, color: "#f59e0b" }
  - { from: crs504, to: local4, label: 2x10G, double: true }

  # Servers to HP 1920
  - { from: hp1920, to: local1, label: 1G, style: dotted }
  - { from: hp1920, to: local2, label: 1G, style: dotted }
  - { from: hp1920, to: local3, label: 1G, style: dotted }
  - { from: hp1920, to: local4, label: 1G, style: dotted }